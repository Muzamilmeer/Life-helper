<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Real Biometric Lock Demo</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:Arial,sans-serif;
        background:#f4f6f9;
        min-height:100vh;
    }

    .topbar{
        background:#667eea;
        color:white;
        padding:20px;
        text-align:center;
        font-size:22px;
        font-weight:bold;
    }

    .container{
        padding:30px;
    }

    .card{
        background:white;
        padding:25px;
        border-radius:15px;
        margin-bottom:20px;
        box-shadow:0 4px 15px rgba(0,0,0,0.1);
    }

    .status{
        padding:15px;
        border-radius:10px;
        margin-bottom:20px;
        font-weight:bold;
    }

    .locked{
        background:#ffe3e3;
        color:#c92a2a;
    }

    .unlocked{
        background:#d3f9d8;
        color:#2b8a3e;
    }

    button{
        padding:14px 20px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:15px;
        margin:5px;
        transition:0.2s;
    }

    button:hover{
        transform:scale(1.03);
    }

    .primary{
        background:#667eea;
        color:white;
    }

    .danger{
        background:#ff6b6b;
        color:white;
    }

    .success{
        background:#51cf66;
        color:white;
    }

    .disabled{
        opacity:0.5;
        cursor:not-allowed;
    }

    .main-app{
        background:white;
        padding:40px;
        border-radius:15px;
        transition:0.3s;
    }

    .blurred{
        filter:blur(6px);
        pointer-events:none;
        user-select:none;
    }

    .overlay{
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.88);
        display:none;
        justify-content:center;
        align-items:center;
        z-index:999;
    }

    .overlay-box{
        background:white;
        width:350px;
        padding:35px;
        border-radius:20px;
        text-align:center;
    }

    .overlay-box i{
        font-size:60px;
        color:#667eea;
        margin-bottom:20px;
    }

    .log-box{
        background:#1e1e1e;
        color:#00ff88;
        height:220px;
        overflow:auto;
        padding:15px;
        border-radius:10px;
        margin-top:15px;
        font-family:monospace;
        font-size:13px;
        white-space:pre-line;
    }
</style>
</head>

<body>

<div class="topbar">
    🔐 Real Biometric Lock Demo
</div>

<div class="container">

    <div class="card">

        <div id="status" class="status unlocked">
            ✅ App Unlocked
        </div>

        <button class="primary" onclick="registerBiometric()">
            <i class="fas fa-fingerprint"></i>
            Setup Biometrics
        </button>

        <button id="lockBtn" class="danger disabled" disabled onclick="lockApp()">
            <i class="fas fa-lock"></i>
            Lock App
        </button>

        <button class="success" onclick="clearLogs()">
            Clear Logs
        </button>

        <div id="logs" class="log-box"></div>

    </div>

    <div id="mainApp" class="main-app">
        <h1>🛍️ ShopEasy App</h1>
        <br>
        <p>This content becomes inaccessible when the app is locked.</p>

        <br>

        <button class="primary">Buy Product</button>
        <button class="primary">Add to Cart</button>
        <button class="primary">Wishlist</button>
    </div>

</div>

<div id="overlay" class="overlay">

    <div class="overlay-box">

        <i class="fas fa-lock"></i>

        <h2>Application Locked</h2>

        <br>

        <p>Please verify your identity</p>

        <br>

        <button class="primary" onclick="authenticateUser()">
            <i class="fas fa-fingerprint"></i>
            Unlock with Biometrics
        </button>

    </div>

</div>

<script>

let biometricReady = false;
let locked = false;

const logs = document.getElementById("logs");

function log(message){

    const time = new Date().toLocaleTimeString();

    logs.innerHTML += `[${time}] ${message}\n`;

    logs.scrollTop = logs.scrollHeight;

    console.log(message);
}

function updateStatus(){

    const status = document.getElementById("status");

    if(locked){

        status.className = "status locked";
        status.innerHTML = "🔒 App Locked";

    }else{

        status.className = "status unlocked";
        status.innerHTML = "✅ App Unlocked";
    }
}

async function registerBiometric(){

    if(!window.PublicKeyCredential){

        alert("WebAuthn not supported in this browser");
        return;
    }

    try{

        log("Starting biometric registration...");

        const publicKey = {

            challenge: new Uint8Array(32),

            rp: {
                name: "ShopEasy"
            },

            user: {
                id: new Uint8Array(16),
                name: "user@example.com",
                displayName: "Demo User"
            },

            pubKeyCredParams: [
                {
                    type: "public-key",
                    alg: -7
                }
            ],

            authenticatorSelection: {
                authenticatorAttachment: "platform",
                userVerification: "required"
            },

            timeout: 60000,

            attestation: "direct"
        };

        await navigator.credentials.create({
            publicKey
        });

        biometricReady = true;

        const btn = document.getElementById("lockBtn");

        btn.disabled = false;
        btn.classList.remove("disabled");

        log("✅ Biometrics registered successfully");

        alert("Biometric setup completed!");

    }catch(err){

        log("❌ Registration failed: " + err.message);

        alert("Biometric registration failed");
    }
}

function lockApp(){

    if(!biometricReady){

        alert("Setup biometrics first");
        return;
    }

    locked = true;

    document.getElementById("mainApp")
        .classList.add("blurred");

    document.getElementById("overlay")
        .style.display = "flex";

    updateStatus();

    log("🔒 App locked");
}

async function authenticateUser(){

    try{

        log("Authenticating user...");

        const publicKey = {

            challenge: new Uint8Array(32),

            timeout: 60000,

            userVerification: "required"
        };

        await navigator.credentials.get({
            publicKey
        });

        unlockApp();

        log("✅ Authentication successful");

    }catch(err){

        log("❌ Authentication failed: " + err.message);

        alert("Authentication failed");
    }
}

function unlockApp(){

    locked = false;

    document.getElementById("mainApp")
        .classList.remove("blurred");

    document.getElementById("overlay")
        .style.display = "none";

    updateStatus();

    log("🔓 App unlocked");
}

function clearLogs(){

    logs.innerHTML = "";
}

document.addEventListener("visibilitychange", () => {

    if(document.hidden && biometricReady){

        lockApp();
    }
});

log("🚀 App started");

</script>

</body>
</html>
